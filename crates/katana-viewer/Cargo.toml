[package]
name = "katana-viewer"
version = "0.1.0"
edition = "2021"

[dependencies]
katana-core = { path = "../katana-core" }
eframe = { version = "0.31", default-features = false, features = ["accesskit", "default_fonts", "wgpu"] }
bytemuck = { version = "1", features = ["derive"] }
wgpu = "24"
clap = { version = "4", features = ["derive"] }
